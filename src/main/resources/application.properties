# ---- React menu: H2 database saved to a FILE in C:\data (towns_db: counties + towns) ----
# On the first start the tables are created and filled from data/counties.csv and data/towns.csv.
spring.datasource.url=jdbc:h2:file:C:/data/townsdb
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
