<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Forex-Account')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('forex')}"></nav>
<main>
    <div class="page-header">
        <div class="container">
            <h1><i class="bi bi-person-badge"></i> Forex-Account</h1>
            <p class="mb-0 opacity-75">Summary of the Oanda practice account.</p>
        </div>
    </div>
    <div class="container">
        <div class="card p-4">
            <table class="table table-striped mb-0">
                <tbody>
                <tr th:each="r : ${rows}">
                    <th style="width:40%" th:text="${r.key}">key</th>
                    <td th:text="${r.value}">value</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
