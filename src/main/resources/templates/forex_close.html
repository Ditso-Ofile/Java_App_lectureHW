<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Forex-Close')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('forex')}"></nav>
<main>
    <div class="page-header">
        <div class="container">
            <h1><i class="bi bi-x-circle"></i> Forex-Close</h1>
            <p class="mb-0 opacity-75">Enter a Trade ID to close the position at market price.</p>
        </div>
    </div>
    <div class="container">
        <div class="card p-4 mb-4">
            <form th:action="@{/forex/close}" th:object="${closeForm}" method="post" class="row g-3 align-items-end">
                <div class="col-md-8">
                    <label class="form-label" for="tradeId">Trade ID</label>
                    <input id="tradeId" type="number" min="1" class="form-control" th:field="*{tradeId}" required>
                    <div class="form-text">You can find the IDs on the <a th:href="@{/forex/positions}">Forex-Pos</a> page.</div>
                </div>
                <div class="col-md-4 d-grid">
                    <button type="submit" class="btn btn-danger"><i class="bi bi-x-octagon"></i> Close position</button>
                </div>
            </form>
        </div>
        <div th:if="${closed}" class="alert alert-success">
            <i class="bi bi-check-circle"></i> Position closed, trade ID: <strong th:text="${closed}"></strong>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
