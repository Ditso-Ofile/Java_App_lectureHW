<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Forex-Pos')}"></head>
<body>
<nav th:replace="~{fragments :: navbar('forex')}"></nav>
<main>
    <div class="page-header">
        <div class="container">
            <h1><i class="bi bi-list-ul"></i> Forex-Pos</h1>
            <p class="mb-0 opacity-75">Open positions (trades) of the account.</p>
        </div>
    </div>
    <div class="container">
        <div class="card p-4">
            <div th:if="${trades.isEmpty()}" class="text-muted">There are no open positions.</div>
            <div th:unless="${trades.isEmpty()}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                    <tr>
                        <th>Trade ID</th><th>Instrument</th><th>Open time</th><th class="text-end">Units</th>
                        <th class="text-end">Open price</th><th class="text-end">Unrealized P/L</th><th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="t : ${trades}">
                        <td th:text="${t.id}"></td>
                        <td th:text="${t.instrument}"></td>
                        <td class="small" th:text="${t.openTime}"></td>
                        <td class="text-end" th:text="${t.currentUnits}"></td>
                        <td class="text-end" th:text="${t.price}"></td>
                        <td class="text-end fw-bold"
                            th:classappend="${t.unrealizedPL.toString().startsWith('-')} ? 'text-danger' : 'text-success'"
                            th:text="${t.unrealizedPL}"></td>
                        <td class="text-end">
                            <form th:action="@{/forex/close}" method="post" class="d-inline">
                                <input type="hidden" name="tradeId" th:value="${t.id}">
                                <button class="btn btn-sm btn-outline-danger" type="submit">Close</button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
